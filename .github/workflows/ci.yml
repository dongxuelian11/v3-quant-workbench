name: Research desktop checks

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/backend/requirements-research.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          npm.cmd ci --no-audit --no-fund
          python -m pip install setuptools wheel
          python -m pip install --no-build-isolation -r apps/backend/requirements-research.txt
          "V3_RESEARCH_PYTHON=$env:pythonLocation/python.exe" >> $env:GITHUB_ENV
      - name: Build desktop
        run: npm run build
      - name: Check research calculations and persistence
        run: npm test
